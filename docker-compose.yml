services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logs_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-logs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logs}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      network: host
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-logs}:${POSTGRES_PASSWORD:-logs}@postgres:5432/${POSTGRES_DB:-logs_dashboard}?sslmode=disable
      LISTEN_ADDR: :8080
      MAILLOG_PATH: /var/log/maillog
      AUTO_INGEST: ${AUTO_INGEST:-true}
      MAILLOG_POLL_INTERVAL: ${MAILLOG_POLL_INTERVAL:-250ms}
      MAILLOG_ROTATION_DRAIN_TIMEOUT: ${MAILLOG_ROTATION_DRAIN_TIMEOUT:-1s}
      MAILLOG_QUEUE_IDLE_TIMEOUT: ${MAILLOG_QUEUE_IDLE_TIMEOUT:-30m}
      MAILLOG_PROCESSING_WORKERS: ${MAILLOG_PROCESSING_WORKERS:-4}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME_MINUTES: ${DB_CONN_MAX_LIFETIME_MINUTES:-30}
      AUTO_NGINX_SECURITY_INGEST: ${AUTO_NGINX_SECURITY_INGEST:-true}
      NGINX_ACCESS_LOG_PATH: ${NGINX_ACCESS_LOG_PATH:-/var/log/nginx/access.log}
      NGINX_LOG_POLL_INTERVAL: ${NGINX_LOG_POLL_INTERVAL:-250ms}
      NGINX_LOG_ROTATION_DRAIN_TIMEOUT: ${NGINX_LOG_ROTATION_DRAIN_TIMEOUT:-1s}
      BRUTEFORCE_404_CONSECUTIVE_THRESHOLD: ${BRUTEFORCE_404_CONSECUTIVE_THRESHOLD:-10}
      BRUTEFORCE_404_WINDOW: ${BRUTEFORCE_404_WINDOW:-2m}
      BRUTEFORCE_404_IGNORED_PATHS: ${BRUTEFORCE_404_IGNORED_PATHS:-/favicon.ico,/robots.txt,/api/health}
      BRUTEFORCE_AUTH_THRESHOLD: ${BRUTEFORCE_AUTH_THRESHOLD:-10}
      BRUTEFORCE_AUTH_WINDOW: ${BRUTEFORCE_AUTH_WINDOW:-5m}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      SECURITY_IP_ALLOWLIST: ${SECURITY_IP_ALLOWLIST:-127.0.0.0/8,::1/128}
      FIREWALL_AGENT_SOCKET: ${FIREWALL_AGENT_SOCKET:-/run/logs-dashboard/firewall.sock}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      # Keep the API non-root. Grant UID 65532 read access with a POSIX ACL on
      # the host, or use adm/log membership for a host-installed service user.
      - ${MAILLOG_PATH:-/var/log/maillog}:/var/log/maillog:ro
      - ${NGINX_LOG_DIR:-/var/log/nginx}:/var/log/nginx:ro
      - /run/logs-dashboard:/run/logs-dashboard
    group_add:
      - ${HOST_ACCESS_GID:-65532}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      network: host
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      API_INTERNAL_BASE: http://api:8080
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
